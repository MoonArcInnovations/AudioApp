name: audioapp
description: "Professional Audiometry Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Routing
  go_router: ^14.2.0
  
  # Local Database
  sqflite: ^2.3.3
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Firebase (Backend)
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  
  # Charts & Visualization
  fl_chart: ^0.68.0
  
  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0
  
  # Audio
  just_audio: ^0.9.37
  audio_session: ^0.1.19
  
  # Permissions
  permission_handler: ^11.3.1
  
  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  share_plus: ^9.0.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.0
  file_picker: ^8.0.7
  xml: ^6.5.0
  
  # Security
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9
  drift_dev: ^2.18.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
